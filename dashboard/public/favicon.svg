<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Emerald & Cyan Neon Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#00e5a3"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Inner Ribbon W Gradient -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="whatsText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="msgText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow & Shadow for transparency versatility (works on dark & light) -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Icon Group -->
  <g transform="translate(0, -12)" filter="url(#ambientGlow)">
    <!-- WhatsApp Chat Bubble Contour -->
    <path d="M 256 50 
             C 168 50, 96 118, 96 202 
             C 96 234, 107 264, 126 290 
             L 106 364 
             L 184 342 
             C 206 351, 230 354, 256 354 
             C 344 354, 416 286, 416 202 
             C 416 118, 344 50, 256 50 Z" 
          fill="none" 
          stroke="url(#bubbleGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic W Ribbon Icon -->
    <path d="M 175 168 
             C 183 204, 198 258, 209 284 
             C 215 296, 225 296, 231 284 
             C 240 264, 250 220, 256 198 
             C 262 220, 272 264, 281 284 
             C 287 296, 297 296, 303 284 
             C 314 258, 329 204, 337 168" 
          fill="none" 
          stroke="url(#wGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Typography: WhatsMsg -->
  <g filter="url(#dropGlow)">
    <text x="256" y="442" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="66" 
          font-weight="900" 
          letter-spacing="0.5" 
          text-anchor="middle">
      <tspan fill="url(#whatsText)">Whats</tspan><tspan fill="url(#msgText)">Msg</tspan>
    </text>
  </g>
</svg>