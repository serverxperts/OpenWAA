<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c131d"/>
      <stop offset="100%" stop-color="#03070d"/>
    </linearGradient>

    <!-- Neon Cyan & Mint Green Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#00e5a3"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="7"/>

  <!-- Chat Bubble & W Emblem -->
  <g transform="translate(0, -22)" filter="url(#softGlow)">
    <!-- Speech bubble contour -->
    <path d="M 256 82 
             C 174 82, 108 144, 108 222 
             C 108 252, 118 280, 136 304 
             L 116 372 
             L 188 351 
             C 209 360, 232 364, 256 364 
             C 338 364, 404 302, 404 222 
             C 404 144, 338 82, 256 82 Z" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic W Emblem -->
    <path d="M 180 188 
             C 188 220, 202 268, 212 292 
             C 217 302, 226 302, 231 292 
             C 240 274, 250 236, 256 218 
             C 262 236, 272 274, 281 292 
             C 286 302, 295 302, 300 292 
             C 310 268, 324 220, 332 188" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- WhatsMsg Brand Text -->
  <text x="256" y="440" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="0.5" 
        text-anchor="middle" 
        fill="url(#textGrad)"
        filter="url(#textGlow)">WhatsMsg</text>
</svg>